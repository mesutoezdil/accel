<circle cx="96" cy="54" r="6" fill="#28c840"/>
<text x="50%" y="58" text-anchor="middle" fill="#8b949e" font-size="12">siltide · Help</text>
<g xml:space="preserve" transform="translate(36 36)">
<text y="70.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#0b5cad" font-weight="bold">siltide</tspan><tspan x="78.8" fill="#6b6b61">  │  </tspan><tspan x="120.8" fill="#c9d1d9">h100-node-07</tspan><tspan x="221.6" fill="#6b6b61">  │  </tspan><tspan x="263.6" fill="#c9d1d9">17 devices</tspan><tspan x="347.6" fill="#6b6b61">  │  </tspan><tspan x="389.6" fill="#c9d1d9">7 nodes</tspan><tspan x="448.4" fill="#6b6b61">  │  </tspan><tspan x="490.4" fill="#c02626">▲ 5 alerts</tspan><tspan x="1078.4" fill="#6b6b61">20:48:09                         </tspan></text>
<rect x="1212.8" y="74.0" width="67.2" height="18.0" fill="#0b5cad"/>
<text y="88.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#6b6b61">1</tspan><tspan x="28.4" fill="#c9d1d9"> Overview  </tspan><tspan x="120.8" fill="#6b6b61">2</tspan><tspan x="129.2" fill="#c9d1d9"> Devices  </tspan><tspan x="213.2" fill="#6b6b61">3</tspan><tspan x="221.6" fill="#c9d1d9"> Procs  </tspan><tspan x="288.8" fill="#6b6b61">4</tspan><tspan x="297.2" fill="#c9d1d9"> Memory  </tspan><tspan x="372.8" fill="#6b6b61">5</tspan><tspan x="381.2" fill="#c9d1d9"> Power  </tspan><tspan x="448.4" fill="#6b6b61">6</tspan><tspan x="456.8" fill="#c9d1d9"> Thermal  </tspan><tspan x="540.8" fill="#6b6b61">7</tspan><tspan x="549.2" fill="#c9d1d9"> Links  </tspan><tspan x="616.4" fill="#6b6b61">8</tspan><tspan x="624.8" fill="#c9d1d9"> History  </tspan><tspan x="708.8" fill="#6b6b61">9</tspan><tspan x="717.2" fill="#c9d1d9"> Events  </tspan><tspan x="792.8" fill="#6b6b61">0</tspan><tspan x="801.2" fill="#c9d1d9"> Nodes  </tspan><tspan x="868.4" fill="#6b6b61">N</tspan><tspan x="876.8" fill="#c9d1d9"> Net  </tspan><tspan x="927.2" fill="#6b6b61">K</tspan><tspan x="935.6" fill="#c9d1d9"> Kube  </tspan><tspan x="994.4" fill="#6b6b61">W</tspan><tspan x="1002.8" fill="#c9d1d9"> Work  </tspan><tspan x="1061.6" fill="#6b6b61">D</tspan><tspan x="1070.0" fill="#c9d1d9"> Dash  </tspan><tspan x="1128.8" fill="#6b6b61">H</tspan><tspan x="1137.2" fill="#c9d1d9"> Health  </tspan><tspan x="1212.8" fill="#f7f5ef" font-weight="bold"> ? Help </tspan></text>
<text y="106.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9" font-weight="bold">Keys</tspan></text>
<text y="124.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  up k           </tspan><tspan x="162.8" fill="#6b6b61">select previous row</tspan></text>
<text y="142.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  down j         </tspan><tspan x="162.8" fill="#6b6b61">select next row</tspan></text>
<text y="160.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  pgup ctrl+u    </tspan><tspan x="162.8" fill="#6b6b61">up 10 rows</tspan></text>
<text y="178.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  pgdown ctrl+d  </tspan><tspan x="162.8" fill="#6b6b61">down 10 rows</tspan></text>
<text y="196.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  enter          </tspan><tspan x="162.8" fill="#6b6b61">open the selected row (device detail, pod describe)</tspan></text>
<text y="214.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  esc            </tspan><tspan x="162.8" fill="#6b6b61">clear filters, then back to the overview</tspan></text>
<text y="232.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  tab right ]    </tspan><tspan x="162.8" fill="#6b6b61">next tab</tspan></text>
<text y="250.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  shift+tab left [ </tspan><tspan x="179.6" fill="#6b6b61">previous tab</tspan></text>
<text y="268.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  p              </tspan><tspan x="162.8" fill="#6b6b61">pause updates</tspan></text>
<text y="286.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  r              </tspan><tspan x="162.8" fill="#6b6b61">collect now</tspan></text>
<text y="304.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  /              </tspan><tspan x="162.8" fill="#6b6b61">filter: words, dev:3 user:vllm ns:ml, util&gt;80 temp&gt;=70, ! negates</tspan></text>
<text y="322.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  :              </tspan><tspan x="162.8" fill="#6b6b61">command bar: it lists what it takes, ↑↓ to move, Tab to take one</tspan></text>
<text y="340.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  s              </tspan><tspan x="162.8" fill="#6b6b61">sort by the next column</tspan></text>
<text y="358.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  S              </tspan><tspan x="162.8" fill="#6b6b61">reverse the sort</tspan></text>
<text y="376.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  ,              </tspan><tspan x="162.8" fill="#6b6b61">history: one step back</tspan></text>
<text y="394.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  .              </tspan><tspan x="162.8" fill="#6b6b61">history: one step forward</tspan></text>
<text y="412.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  &lt; &gt;            </tspan><tspan x="162.8" fill="#6b6b61">history: 30 steps</tspan></text>
<text y="430.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  n              </tspan><tspan x="162.8" fill="#6b6b61">history: back to now</tspan></text>
<text y="448.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  m              </tspan><tspan x="162.8" fill="#6b6b61">history: next metric</tspan></text>
<text y="466.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  + =            </tspan><tspan x="162.8" fill="#6b6b61">history: narrower window</tspan></text>
<text y="484.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  -              </tspan><tspan x="162.8" fill="#6b6b61">history: wider window</tspan></text>
<text y="502.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  {              </tspan><tspan x="162.8" fill="#6b6b61">history: previous device</tspan></text>
<text y="520.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  }              </tspan><tspan x="162.8" fill="#6b6b61">history: next device</tspan></text>
<text y="538.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  d              </tspan><tspan x="162.8" fill="#6b6b61">Kubernetes: describe pod</tspan></text>
<text y="556.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  l              </tspan><tspan x="162.8" fill="#6b6b61">Kubernetes: container logs</tspan></text>
<text y="574.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  c              </tspan><tspan x="162.8" fill="#6b6b61">logs: next container</tspan></text>
<text y="592.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  w              </tspan><tspan x="162.8" fill="#6b6b61">logs: wrap lines</tspan></text>
<text y="610.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  D              </tspan><tspan x="162.8" fill="#6b6b61">dashboard</tspan></text>
<text y="628.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  ctrl+n         </tspan><tspan x="162.8" fill="#6b6b61">next node (filters every tab)</tspan></text>
<text y="646.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  ctrl+p         </tspan><tspan x="162.8" fill="#6b6b61">previous node</tspan></text>
<text y="664.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  ctrl+e         </tspan><tspan x="162.8" fill="#6b6b61">export history of the devices in view to CSV</tspan></text>
<text y="682.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  ?              </tspan><tspan x="162.8" fill="#6b6b61">this screen</tspan></text>
<text y="700.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  q ctrl+c       </tspan><tspan x="162.8" fill="#6b6b61">quit</tspan></text>
<text y="718.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  1-9 0 N K W D… </tspan><tspan x="162.8" fill="#6b6b61">switch tab; tabs, rows, column headers, and footer hints are clickable, the wheel scrolls, double-click opens</tspan></text>
<text y="754.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9" font-weight="bold">Commands</tspan><tspan x="87.2" fill="#6b6b61">  (: then)</tspan></text>
<text y="772.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  &lt;tab name&gt;                             </tspan><tspan x="364.4" fill="#6b6b61">switch tab, e.g. :proc</tspan></text>
<text y="790.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#c9d1d9">  sort &lt;column&gt;                          </tspan><tspan x="364.4" fill="#6b6b61">sort the current table</tspan></text>
<text y="808.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#6b6b61">⏎ detail  tab next  p pause  r refresh  / search  : command  ? help  q quit</tspan></text>
