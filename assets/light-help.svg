<text x="50%" y="58" text-anchor="middle" fill="#8b949e" font-size="12">siltide · Help</text>
<g xml:space="preserve" transform="translate(36 36)">
<text y="70.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#0b5cad" font-weight="bold">siltide</tspan><tspan x="78.8" fill="#55554d">  │  </tspan><tspan x="120.8">h100-node-07</tspan><tspan x="221.6" fill="#55554d">  │  </tspan><tspan x="263.6">17 devices</tspan><tspan x="347.6" fill="#55554d">  │  </tspan><tspan x="389.6">7 nodes</tspan><tspan x="448.4" fill="#55554d">  │  </tspan><tspan x="490.4" fill="#c02626">▲ 5 alerts</tspan><tspan x="1078.4" fill="#55554d">21:46:36                         </tspan></text>
<rect x="1212.8" y="74.0" width="67.2" height="18.0" fill="#0b5cad"/>
<text y="88.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#55554d">1</tspan><tspan x="28.4"> Overview  </tspan><tspan x="120.8" fill="#55554d">2</tspan><tspan x="129.2"> Devices  </tspan><tspan x="213.2" fill="#55554d">3</tspan><tspan x="221.6"> Procs  </tspan><tspan x="288.8" fill="#55554d">4</tspan><tspan x="297.2"> Memory  </tspan><tspan x="372.8" fill="#55554d">5</tspan><tspan x="381.2"> Power  </tspan><tspan x="448.4" fill="#55554d">6</tspan><tspan x="456.8"> Thermal  </tspan><tspan x="540.8" fill="#55554d">7</tspan><tspan x="549.2"> Links  </tspan><tspan x="616.4" fill="#55554d">8</tspan><tspan x="624.8"> History  </tspan><tspan x="708.8" fill="#55554d">9</tspan><tspan x="717.2"> Events  </tspan><tspan x="792.8" fill="#55554d">0</tspan><tspan x="801.2"> Nodes  </tspan><tspan x="868.4" fill="#55554d">N</tspan><tspan x="876.8"> Net  </tspan><tspan x="927.2" fill="#55554d">K</tspan><tspan x="935.6"> Kube  </tspan><tspan x="994.4" fill="#55554d">W</tspan><tspan x="1002.8"> Work  </tspan><tspan x="1061.6" fill="#55554d">D</tspan><tspan x="1070.0"> Dash  </tspan><tspan x="1128.8" fill="#55554d">H</tspan><tspan x="1137.2"> Health  </tspan><tspan x="1212.8" fill="#f7f5ef" font-weight="bold"> ? Help </tspan></text>
<text y="106.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" font-weight="bold">Keys</tspan></text>
<text y="124.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  up k           </tspan><tspan x="162.8" fill="#55554d">select previous row</tspan></text>
<text y="142.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  down j         </tspan><tspan x="162.8" fill="#55554d">select next row</tspan></text>
<text y="160.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  pgup ctrl+u    </tspan><tspan x="162.8" fill="#55554d">up 10 rows</tspan></text>
<text y="178.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  pgdown ctrl+d  </tspan><tspan x="162.8" fill="#55554d">down 10 rows</tspan></text>
<text y="196.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  enter          </tspan><tspan x="162.8" fill="#55554d">open the selected row (device detail, pod describe)</tspan></text>
<text y="214.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  esc            </tspan><tspan x="162.8" fill="#55554d">clear filters, then back to the overview</tspan></text>
<text y="232.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  tab right ]    </tspan><tspan x="162.8" fill="#55554d">next tab</tspan></text>
<text y="250.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  shift+tab left [ </tspan><tspan x="179.6" fill="#55554d">previous tab</tspan></text>
<text y="268.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  p              </tspan><tspan x="162.8" fill="#55554d">pause updates</tspan></text>
<text y="286.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  r              </tspan><tspan x="162.8" fill="#55554d">collect now</tspan></text>
<text y="304.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  /              </tspan><tspan x="162.8" fill="#55554d">filter: words, dev:3 user:vllm ns:ml, util&gt;80 temp&gt;=70, ! negates</tspan></text>
<text y="322.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  :              </tspan><tspan x="162.8" fill="#55554d">command bar: it lists what it takes, ↑↓ to move, Tab to take one</tspan></text>
<text y="340.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  s              </tspan><tspan x="162.8" fill="#55554d">sort by the next column</tspan></text>
<text y="358.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  S              </tspan><tspan x="162.8" fill="#55554d">reverse the sort</tspan></text>
<text y="376.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  ,              </tspan><tspan x="162.8" fill="#55554d">history: one step back</tspan></text>
<text y="394.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  .              </tspan><tspan x="162.8" fill="#55554d">history: one step forward</tspan></text>
<text y="412.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  &lt; &gt;            </tspan><tspan x="162.8" fill="#55554d">history: 30 steps</tspan></text>
<text y="430.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  n              </tspan><tspan x="162.8" fill="#55554d">history: back to now</tspan></text>
<text y="448.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  m              </tspan><tspan x="162.8" fill="#55554d">history: next metric</tspan></text>
<text y="466.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  + =            </tspan><tspan x="162.8" fill="#55554d">history: narrower window</tspan></text>
<text y="484.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  -              </tspan><tspan x="162.8" fill="#55554d">history: wider window</tspan></text>
<text y="502.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  {              </tspan><tspan x="162.8" fill="#55554d">history: previous device</tspan></text>
<text y="520.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  }              </tspan><tspan x="162.8" fill="#55554d">history: next device</tspan></text>
<text y="538.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  d              </tspan><tspan x="162.8" fill="#55554d">Kubernetes: describe pod</tspan></text>
<text y="556.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  l              </tspan><tspan x="162.8" fill="#55554d">Kubernetes: container logs</tspan></text>
<text y="574.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  c              </tspan><tspan x="162.8" fill="#55554d">logs: next container</tspan></text>
<text y="592.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  w              </tspan><tspan x="162.8" fill="#55554d">logs: wrap lines</tspan></text>
<text y="610.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  D              </tspan><tspan x="162.8" fill="#55554d">dashboard</tspan></text>
<text y="628.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  ctrl+n         </tspan><tspan x="162.8" fill="#55554d">next node (filters every tab)</tspan></text>
<text y="646.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  ctrl+p         </tspan><tspan x="162.8" fill="#55554d">previous node</tspan></text>
<text y="664.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  ctrl+e         </tspan><tspan x="162.8" fill="#55554d">export history of the devices in view to CSV</tspan></text>
<text y="682.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  ?              </tspan><tspan x="162.8" fill="#55554d">this screen</tspan></text>
<text y="700.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  q ctrl+c       </tspan><tspan x="162.8" fill="#55554d">quit</tspan></text>
<text y="718.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  1-9 0 N K W D… </tspan><tspan x="162.8" fill="#55554d">switch tab; tabs, rows, column headers, and footer hints are clickable, the wheel scrolls, double-click opens</tspan></text>
<text y="754.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" font-weight="bold">Commands</tspan><tspan x="87.2" fill="#55554d">  (: then)</tspan></text>
<text y="772.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  &lt;tab name&gt;                             </tspan><tspan x="364.4" fill="#55554d">switch tab, e.g. :proc</tspan></text>
<text y="790.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0">  sort &lt;column&gt;                          </tspan><tspan x="364.4" fill="#55554d">sort the current table</tspan></text>
<text y="808.0" fill="#2b2b2b" xml:space="preserve" style="white-space:pre"><tspan x="20.0" fill="#55554d">⏎ detail  tab next  p pause  r refresh  / search  : command  ? help  q quit</tspan></text>
</g>
</svg>
