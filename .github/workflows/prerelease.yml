# Every push to main publishes a prerelease named after the next patch
# version and the number of commits since the last stable tag, for example
# `v0.1.3-main.7`, so the newest binaries are always one download away.
name: prerelease
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tag
        id: tag
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          n=$(git rev-list --count "${last}..HEAD" 2>/dev/null || git rev-list --count HEAD)
          next=$(echo "$last" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          tag="${next}-main.${n}"
          git tag -f "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
