name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # A signed statement per artifact saying which workflow, at which commit,
  # produced it. `gh attestation verify` is what reads it.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Everything published, not only the binaries: a package or an SBOM that
      # cannot be traced back to a run is the gap someone would use.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/siltide-*
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/*.sbom.json

  # After the release is public, so the AUR package points at assets that
  # exist. Split out so a failed publish can be retried by hand without
  # cutting another release.
  aur:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/aur-publish.yml
    secrets: inherit
    with:
      # github.ref_name is the tag (v1.2.3); the package wants 1.2.3
      version: ${{ github.ref_name }}
